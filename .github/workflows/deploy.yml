name: Deploy to workshop27.inesweb.org

# Runs on every push to main, and can be run by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys run at once.
concurrency:
  group: deploy-inesweb
  cancel-in-progress: false

env:
  EXCLUDES: >-
    --exclude-glob .git/
    --exclude-glob .github/
    --exclude-glob .gitignore
    --exclude-glob README.md
    --exclude-glob *.gs
    --exclude-glob .DS_Store

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Install the deploy key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Show what would be sent (dry run)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          lftp -c "set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes'; set net:max-retries 2; set net:timeout 20; set cmd:fail-exit yes; open -u $DEPLOY_USER, sftp://$DEPLOY_HOST; mirror -R --dry-run --verbose $EXCLUDES ./ $DEPLOY_PATH/"

      - name: Deploy
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          lftp -c "set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes'; set net:max-retries 2; set net:timeout 20; set cmd:fail-exit yes; open -u $DEPLOY_USER, sftp://$DEPLOY_HOST; mirror -R --verbose $EXCLUDES ./ $DEPLOY_PATH/"

      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key

# WHY lftp AND NOT rsync
# The DreamHost account is SFTP-only: it authenticates with the key but will
# not run remote commands, and rsync has to start a copy of itself on the far
# end. lftp's mirror works over the SFTP subsystem alone, so it does not.
#
# WHY "open -u $DEPLOY_USER," AND NOT "open sftp://user@host"
# Without a password in the open command, lftp tries to prompt for one. On a
# runner there is no terminal, so it reports "GetPass() failed -- assume
# anonymous login" and then fails with "Login failed: Password required".
# Passing an empty password after the comma stops it asking. Authentication
# still happens entirely through the key in connect-program; the empty
# password is never used.
#
# WHY THE lftp COMMAND IS ALL ON ONE LINE
# lftp -c treats every newline as the end of a command. Spreading the mirror
# options over several lines makes it read each one as a command of its own
# and fail with "Unknown command `--exclude-glob'".
#
# WHY NO --delete
# Left out on purpose. With it, anything at the destination that is not in the
# repository is removed. If DEPLOY_PATH were ever wrong, that turns a
# misplaced upload into a deletion. Without it, a file you delete from the repo
# lingers on the server until someone clears it by hand - the safer failure.
#
# DreamHost's placeholder index.html gets overwritten by ours on the first
# deploy, which is what we want. Any other placeholder files DreamHost left
# behind will stay until removed manually over SFTP.
